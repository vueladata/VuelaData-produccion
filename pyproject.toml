[project]
name = "vueladata"
version = "0.1.0"
description = "Integrated airline operations and data platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pandas>=2.2,<4.0",
    "numpy>=2.0,<3.0",
    "Faker>=30,<50",
    "python-dotenv>=1.0,<2.0",
    "pika>=1.3,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
